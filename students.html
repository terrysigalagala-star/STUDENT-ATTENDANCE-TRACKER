<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Student Attendance Tracker</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="students.html">Students</a>
            <a href="attendance.html">Attendance</a>
            <a href="reports.html">Reports</a>
        </nav>
    </header>

    <main>
        <section class="registration">
            <h2>Register New Student</h2>
            <p>Enter the student's details in the form below.</p>

            <form action="#" method="post">

                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname"
                       placeholder="Enter full name" required>

                <label for="admission">Admission Number</label>
                <input type="text" id="admission" name="admission"
                       placeholder="Enter admission number" required>

                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>

                <label for="class">Class / Course</label>
                <input type="text" id="class" name="class"
                       placeholder="Enter class or course" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter email address">

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter phone number">

                <button type="submit">Register Student</button>

            </form>
        </section>
    </main>

    <footer>
        <p>2026 Student Attendance Tracker. All Rights Reserved.</p>
    </footer>

</body>
</html>
